services:
  db:
    image: postgres:17-alpine
    container_name: yeg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yeg
      POSTGRES_PASSWORD: yeg_local_dev
      POSTGRES_DB: yeg
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeg -d yeg"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - yeg-pgdata:/var/lib/postgresql/data

volumes:
  yeg-pgdata:
